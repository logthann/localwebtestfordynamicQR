          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">

    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 50px;">

    <h1>Hệ Thống Kiểm Tra Dynamic QR - trang số 1</h1>
    <p>Trạng thái: <strong>Website hoạt động bình thường</strong></p>
    
    <div style="margin-top: 30px; background: #f0f0f0; padding: 20px; display: inline-block; border-radius: 8px;">
        <h3>Các tham số UTM nhận được từ URL:</h3>
        <p id="utm-info" style="color: green; font-weight: bold;"></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const source = urlParams.get('utm_source') || 'Không có';
        const medium = urlParams.get('utm_medium') || 'Không có';
        const campaign = urlParams.get('utm_campaign') || 'Không có';
        
        document.getElementById('utm-info').innerHTML = 
            `Source: ${source} <br> Medium: ${medium} <br> Campaign: ${campaign}`;
    </script>
</body>
</html>
